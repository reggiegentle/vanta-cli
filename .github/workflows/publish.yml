name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run check:release
      # Two supported setups for this step, never both at once:
      # 1. An NPM_TOKEN repository secret, kept below, alongside
      #    --provenance (uses this job's id-token: write permission to
      #    attach a signed build provenance attestation to the publish).
      # 2. npm trusted publishing configured for this repository on
      #    npmjs.com, in which case the NODE_AUTH_TOKEN line below is
      #    removed entirely; npm authenticates via the OIDC token this
      #    job's id-token: write permission already provides, and
      #    --provenance still applies.
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
